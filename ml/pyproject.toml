[project]
name = "haiti-tts-ml"
version = "1"
description = "iniciando"
authors = [
    {name = "arturosojovivas@gmail.com"}
]
license = {text = "none"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch (>=2.8.0,<3.0.0)",
    "coqui-tts (>=0.27.2,<0.28.0)",
    "openai-whisper (>=20250625,<20250626)",
    "pydub (>=0.25.1,<0.26.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "numba (>=0.62.1,<0.63.0)",
    "ffmpeg-python (>=0.2.0,<0.3.0)",
    "langid (>=1.1.6,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "typer (>=0.19.2,<0.20.0)",
    "redis (>=6.4.0,<7.0.0)",
    "rq (>=2.6.0,<3.0.0)",
    "fastapi (>=0.118.0,<0.119.0)",
    "uvicorn (>=0.37.0,<0.38.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false